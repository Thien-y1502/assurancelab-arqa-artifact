name: reproduce-arqa

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile ARQA/run_arqa_v3.py
      - run: python ARQA/run_arqa_v3.py
      - run: python -c "import json; assert json.load(open('ARQA/results.json'))['status'] == 'PASS'"
